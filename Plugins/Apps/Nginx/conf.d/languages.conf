
# Here we include only those languages that are supported
# by https://github.com/ConfigLMM/HttpErrorPages/tree/configlmm/i18n

map $http_accept_language $userLanguage
{
    default      en_US;
    ~*^es-VE     es_VE;
    ~*^es        es_VE; # Fallback
    ~*^fr-FR     fr_FR;
    ~*^fr        fr_FR;
    ~*^it-IT     it_IT;
    ~*^it        it_IT;
    ~*^lv-LV     lv_LV;
    ~*^lv        lv_LV;
    ~*^pl        pl_PL;
    ~*^pt-BR     pt_BR;
    ~*^pt        pt_BR;
    ~*^zh-CN     zh_CN;
    ~*^zh        zh_CN;
}
