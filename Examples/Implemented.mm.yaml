            endpoint: 192.168.1.3:4317
            tls:
                insecure: true

# https://peppermint.sh/
Peppermint:
    Type: Peppermint
    Location: ssh://example.org/
    Domain: Peppermint.example.org

# https://github.com/ItzCrazyKns/Perplexica/
Perplexica:
    Type: Perplexica
    Ollama:
        URL: http://localhost:11434/

PHPFPM:
    Type: PHPFPM
    Settings:
        memory_limit: 1G

# https://www.postfix.org/
Postfix:
    Type: Postfix
    Location: ssh://example.org/
    AlternativePort: 2525
    SMTP: unix
    ForwardAll: example.com
    ForwardDovecot: yes
    Settings:
        inet_interfaces: $myhostname, localhost
    Accounts:
        Example@Example.org:

PostgreSQL:
    Type: PostgreSQL
    Location: ssh://example.org/
    ListenAll: yes
    Replicate:
        Connection: host=192.168.1.1 user=replication password=${SECRET:POSTGRESQL:REPLICATION_PASSWORD}
        Slot: standby
    AllowReplication:
        - 192.168.1.1/24
    Users:
        replication:
            Replication: yes
            Password: ${ENV:POSTGRES_REPLICATION_PASSWORD}
    Subscriptions:
        db:
            Connection: user=replication dbname=db password=${GENERATE:POSTGRESQL:REPLICATION_PASSWORD}
    Settings:
        wal_level: logical # for Logical Replication

