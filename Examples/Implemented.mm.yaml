
# https://porkbun.com/
Porkbun:
    Type: PorkbunDNS
    DNS:
        example.org:
            '@': A=@me # `@me` means use current hosts external IP

# https://www.tonic.to/
Tonic:
    Type: TonicDNS
    Domain: example.to
    Nameservers:
        ns.example.org: 192.168.5.5

# https://www.powerdns.com/
PowerDNS:
    Type: PowerDNS
    # Location: pdns://dns.example.org:8081/
    # Location: ssh://server/?host=localhost&port=8081
    Location: ssh://server/
    Settings:
        version-string: anonymous
        api: yes
        expand-alias: yes
        resolver: 127.0.0.53
        default-soa-content: ns.example.org. contact.example.org. 0 10800 3600 604800 3600
    DNS:
        example.org:
            '@': A=@me
            ns: A=192.168.5.5

# https://www.godaddy.com/
GoDaddy:
    Type: GoDaddyDNS
    DNS:
        example.org:
            '@': A=@me
            Wiki: CNAME=@ # `@` means point it to the domain root (ie. example.org)
            ipv6:
                - AAAA=2606:2800:21f:cb07:6820:80da:af6b:8b2c
                - AAAA=2606:2800:21f:cb07:6820:80da:af6b:0153

# https://letsencrypt.org/
LetsEncrypt:
    Type: LetsEncrypt
    EMail: DNS@Example.org
    Domain: '*.Example.org'
    DNS:
        IP: 127.0.0.1
        SecretId: PowerDNS.TSIG_ConfigLMM_KEY
        Propagation: 5
    Certificates:
        Example: '*.Example.com'
    Hooks:
        - nginx
        - postfix

Linux:
    Type: Linux
    Location: qemu:///session
    AlternativeLocation: ssh://example.org/
    OS: openSUSE Leap
    CPU: 2
    RAM: 4 GiB
    Storage: 30 GiB
    Tmpfs: 1G
    Domain: example.org
    Hosts:
        127.0.0.1:
            - example.org
    Apps:
        - sshd
        - fish
        - vim
    Users:
        root:
            Shell: fish
            SSH:
                Key: yes
            AuthorizedKeys:
                - ~/.ssh/id_ed25519.pub
    SSH:
        Config:
            Example:
                User: root
                HostName: example.org
    Sysctl:
        vm.overcommit_memory: 1 # Need for ValKey
        net.ipv4.ip_forward: 1 # Need for Wanguard
    Network:
        IP: 192.168.1.2/24
        Gateway: 192.168.1.1
        DNS: 192.168.1.1
    Execute:
        sh: echo Hello World from ConfigLMM > /tmp/hello

SSH:
    Type: SSH
    Location: ssh://example.org/
    Port: 1234
    Settings:
        PasswordAuthentication: no

Systemd:
    Type: systemd
    Location: ssh://example.org/
    UserCgroups: yes # Need for Podman

# https://answer.apache.org/
Answer:
    Type: Answer
    Domain: example.org
    Plugins:
        - github.com/apache/answer-plugins/connector-basic
        - github.com/apache/answer-plugins/editor-chart
        - github.com/apache/answer-plugins/editor-formula
    Site:
        Name: Answer
        ContactEMail: answer@example.org
        Language: en-US
    Admin:
        Username: admin
        EMail: admin@example.org

# https://www.arubanetworks.com/
ArubaInstant:
    Type: ArubaInstant
    Location: user@aruba.example.org
    CertificateName: Aruba

# https://github.com/JustArchiNET/ArchiSteamFarm
ArchiSteamFarm:
    Type: ArchiSteamFarm
    Domain: ASF.example.org

# https://goauthentik.io/
Authentik:
    Type: Authentik
    Location: ssh://example.org/
    Domain: auth.example.org
    Admin:
        EMail: Admin@Example.org
    SMTP:
        SecretId: Postfix
        Host: Example.org
        Port: 465
        Username: EMail@Example.org
        From: Auth <EMail@Example.org>

# https://bitmagnet.io/
Bitmagnet:
    Type: Bitmagnet
    Domain: bitmagnet.example.org

# https://cassandra.apache.org/_/index.html
Cassandra:
    Type: Cassandra
    Location: ssh://example.org/
    ClusterName: Cluster

# https://clickhouse.com/
ClickHouse:
    Type: ClickHouse

Discourse:
    Type: Discourse
    Domain: Discourse.example.org
    ValkeySecretId: Valkey
    Admin:
        Username: Admin
        EMail: Admin@example.org
        FirstName: Admin
        LastName: Admin
    SMTP:
        SecretId: Postfix
        Host: example.org
        Port: 465
        Username: EMail@Example.org
    Plugins:
        - https://github.com/discourse/discourse-openid-connect

# https://www.dovecot.org/
Dovecot:
